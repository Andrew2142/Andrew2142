<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Andrew de Lange. Full Stack developer in Cape Town, building software solutions for companies.">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc97"/>
      <stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.87" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="type"><rect class="t2" x="64" y="156" height="36" width="900"/></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    /* Everything is visible by default; animations only play the reveal, so
       renderers that skip CSS animation still show the full banner. */
    .name { animation: rise 0.7s ease-out 0.3s backwards; }
    .rule { transform-origin: 64px 140px; animation: draw 0.9s ease-out 0.8s backwards; }
    .t2 { animation: type 2.4s steps(77) 1.3s backwards; }
    .cursor { animation: hide 3.7s steps(1) backwards, blink 1s steps(1) 3.7s infinite; }
    .orbit { transform-origin: 1040px 130px; animation: spin 10s linear infinite; }
    .orbit-slow { transform-origin: 1040px 130px; animation: spin 26s linear infinite reverse; }
    .ring { animation: fade 1.2s ease-out 0.4s backwards; }
    @keyframes type { from { width: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    @keyframes draw { from { transform: scaleX(0); } }
    @keyframes hide { from, to { fill-opacity: 0; } }
    @keyframes blink { 50% { fill-opacity: 0; } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .t2, .name, .rule, .cursor, .orbit, .orbit-slow, .ring { animation: none; }
    }
  </style>

  <rect width="1200" height="260" rx="16" fill="#0d1117"/>
  <rect width="1200" height="260" rx="16" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <g class="ring">
    <circle cx="1040" cy="130" r="74" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="1040" cy="130" r="44" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    <g class="orbit"><circle cx="1114" cy="130" r="4" fill="#3ddc97"/></g>
    <g class="orbit-slow"><circle cx="1040" cy="86" r="3" fill="#4f8cff"/></g>
    <circle cx="1040" cy="130" r="5" fill="url(#accent)"/>
  </g>

  <text x="62" y="118" class="sans name" font-size="58" font-weight="800" letter-spacing="-1" fill="#f0f3f9">Andrew de Lange</text>
  <rect class="rule" x="64" y="139" width="180" height="3" rx="1.5" fill="url(#accent)"/>

  <g clip-path="url(#type)">
    <text x="64" y="180" class="mono" font-size="19" fill="#9aa3bd">Full Stack developer in Cape Town, building software solutions for companies.<tspan class="cursor" fill="#3ddc97">▍</tspan></text>
  </g>
</svg>
